# Optimized environment configuration for 16GB VRAM + 64GB RAM systems
# Uses actual dataset dimensions and essential features only
environment:
  # Grid dimensions - matches actual data from sample_model.csv
  grid_size:
    nx: 49   # Actual X dimension from dataset
    ny: 71   # Actual Y dimension from dataset  
    nz: 58   # Actual Z dimension from dataset
  
  # Block size (meters)
  block_size:
    x: 20
    y: 20
    z: 15

# Economic parameters
economics:
  # Metal prices (USD)
  prices:
    cu_price_usd_per_lb: 3.8  
    mo_price_usd_per_lb: 15.0  
    
  # Costs (USD per tonne)
  costs:
    mining_cost: 2.5      
    processing_cost: 8.0   
    fixed_cost: 1.2       
    
  # Processing cost modifiers
  processing_modifiers:
    bwi_factor: 0.1       
    clay_penalty: 0.5     
    
  # Recovery functions
  recovery:
    base_cu_recovery: 0.85  
    base_mo_recovery: 0.70  
    
  # Discount rate
  discount:
    annual_rate: 0.12      
    convert_to_daily: true 

# Mining constraints
constraints:
  # Daily mining capacity (tonnes)
  daily_capacity:
    min_tonnes: 50000     
    max_tonnes: 150000    
    
  # Precedence constraints
  precedence:
    enable_precedence: true
    cross_shape: 5        
    bench_height: 15      
    slope_angle: 45       
    
  # UPL constraints
  upl:
    enforce_upl: true
    upl_field: "upl"      

# State representation - essential features for performance
state:
  # Core geological features (most important)
  geological_features:
    - "cu"          # Copper grade
    - "mo"          # Molybdenum grade  
    - "clays"       # Clay content
    - "bwi"         # Ball Work Index
    - "rec"         # Recovery factor
    
  # Key mineralogy features (reduced set)
  mineralogy_features:
    - "chalcocite"
    - "chalcopyrite"
    - "molibdenite"
    
  # Dynamic features
  dynamic_features:
    - "mined_flag"      
    - "extraction_day"  
    
  # Normalization
  normalization:
    method: "standardize"  
    clip_outliers: true
    outlier_std: 3.0

# Reward function
reward:
  revenue:
    use_tonnage_weight: true
    include_mo_revenue: true
    
  cost:
    include_processing_modifiers: true
    penalize_high_clay: true
    penalize_high_bwi: true
    
  shaping:
    early_termination_penalty: -1000
    invalid_action_penalty: -100
    capacity_violation_penalty: -500