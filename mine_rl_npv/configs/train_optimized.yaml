# Optimized training configuration for 16GB VRAM + 64GB RAM systems
# Single configuration that works efficiently with the sample_model.csv dataset
training:
  algorithm: "MaskablePPO"
  
  # Optimized hyperparameters based on working configuration
  hyperparameters:
    learning_rate: 0.0003
    n_steps: 256            # Good balance for large observations
    batch_size: 64          # Efficient batch size for both CPU/GPU
    n_epochs: 4             
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    
  # Policy network - proven working configuration
  policy:
    net_arch:
      pi: [128, 128]         
      vf: [128, 128]         
    activation_fn: "tanh"
    
  # Feature extractor - use Small variant that works well
  feature_extractor:
    type: "CNN3DSmall"       # Proven to work with this dataset
    output_dim: 256          
    dropout: 0.1            

# Training schedule
schedule:
  total_timesteps: 1000000
  eval_freq: 10000          
  save_freq: 50000          
    
# Environment settings
env_settings:
  n_envs: 1                 # Single env for stability
  max_episode_steps: 2000   
  normalize_obs: true
  normalize_reward: false
  
# Evaluation settings
evaluation:
  n_eval_episodes: 3        
  deterministic: true
  render: false
  
# Logging (simplified to prevent hangs)
logging:
  tensorboard: true
  tensorboard_log: "./experiments/runs/"
  verbose: 1
    
# Checkpointing
checkpointing:
  save_best: true
  save_freq: 50000
  save_path: "./experiments/runs/"
  
# Experiment tracking
experiment:
  name: "minerl_npv_optimized"
  tags: ["mining", "rl", "npv", "optimized"]
  notes: "Single optimized configuration for 16GB VRAM + 64GB RAM systems"